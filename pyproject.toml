[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.1", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "pymergetic-rxf"
dynamic = ["version"]
description = "RXF: an object image with a C++ core, deltas in XML, one file per module"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }
]
keywords = ["pymergetic", "rxf", "state-binary", "executable-format"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = ["fire>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.110", "unicorn>=2.1"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3", "python-multipart>=0.0.20"]

[project.scripts]
rxf = "pymergetic.rxf.cli:main"

[project.urls]
Homepage = "https://github.com/pymergetic/rxf"
Repository = "https://github.com/pymergetic/rxf"
Issues = "https://github.com/pymergetic/rxf/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.packages = ["src/pymergetic"]
# C and C++ sources live next to the Python modules; only the built extension ships.
wheel.exclude = ["**/*.c", "**/*.cpp", "**/*.h", "**/*.hpp"]
sdist.include = ["CMakeLists.txt", "src/**", "third_party/**", "starter/**", "README.md", "LICENSE"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.setuptools_scm.scm.git]
# Only release tags count; legacy-v5-python and other markers are not versions.
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "*-win32", "*_i686"]
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION"]
test-requires = ["pytest>=8", "fastapi>=0.110"]
# Everything except the two tests that compile C (tests/ground).
test-command = "pytest {project}/tests --ignore={project}/tests/test_ground_layout.py --ignore={project}/tests/test_arena_freestanding.py"

[tool.ruff]
# Generated by nanobind.stubgen; tests/test_core_module.py keeps them equal to the module.
extend-exclude = ["src/pymergetic/rxf/core/*.pyi"]

[tool.pytest.ini_options]
# The native tools are scripts (tools/native), not a package; tests import them by name.
pythonpath = ["tools/native"]
filterwarnings = [
  # Python Fire still calls asyncio.iscoroutinefunction (removal planned for 3.16).
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
