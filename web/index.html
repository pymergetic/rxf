<!doctype html>
<meta charset="utf-8">
<title>RXF</title>
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; font:13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
         background:#0b0d10; color:#c9d3dd; }

  /* the side: what this image is, and the acts you can perform on it */
  .side { width:250px; flex:none; display:flex; flex-direction:column;
          background:#12161b; border-right:1px solid #22272e; overflow-y:auto; }
  .side h2, .view h2 { margin:0; padding:10px 12px 6px; font-size:11px; letter-spacing:.08em;
             text-transform:uppercase; color:#5f6b78; font-weight:600; }
  .side .item, .view .item { padding:6px 12px; cursor:pointer; color:#9aa7b4; }
  .side .item:hover, .view .item:hover { background:#1b2128; color:#dfe6ee; }
  .side .item .sub, .view .item .sub { display:block; color:#4a545f; font-size:11px; }
  .side hr, .view hr { border:none; border-top:1px solid #22272e; margin:8px 0; }

  /* the right: tabs, one console per image */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .tabs { display:flex; gap:1px; background:#171b21; border-bottom:1px solid #22272e;
          padding:6px 8px 0; overflow-x:auto; }
  .tab { display:flex; align-items:center; gap:8px; padding:5px 12px; cursor:pointer;
         border:1px solid #22272e; border-bottom:none; border-radius:6px 6px 0 0;
         background:#12161b; color:#6f7c89; white-space:nowrap; }
  .tab.active { background:#0b0d10; color:#dfe6ee; }
  .tab .dot { width:7px; height:7px; border-radius:50%; background:#4ade80; }
  .tab .x { color:#4a545f; padding:0 2px; }
  .tab .x:hover { color:#e06c75; }
  .newtab { padding:5px 12px; color:#4a545f; cursor:pointer; user-select:none; }
  .newtab:hover { color:#c9d3dd; }

  /* a terminal: the prompt is a line in the stream, not a box below it */
  .termwrap { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
  .term { flex:1; overflow-y:auto; padding:10px 12px; }
  .line { white-space:pre-wrap; word-break:break-word; }
  .line.sys { color:#5f6b78; }
  .line.err { color:#e06c75; }
  .line.ok  { color:#4ade80; }
  .line.cmd { color:#c9d3dd; }
  .line.cmd .ps1 { color:#4ade80; }
  .ask { display:flex; gap:8px; }
  .ask .ps1 { color:#4ade80; }
  .ask input { flex:1; background:none; border:none; outline:none; color:#c9d3dd;
               font:inherit; padding:0; }

  .strip { display:flex; gap:14px; padding:5px 12px; background:#12161b;
           border-top:1px solid #22272e; color:#5f6b78; font-size:12px; }
  .strip button { font:inherit; padding:2px 10px; border:1px solid #2b323a;
                  border-radius:5px; background:#1b2128; color:#c9d3dd; cursor:pointer; }
  .strip button:hover { background:#232a32; }
  .strip .grow { margin-left:auto; }

  /* the view: the digest and what it covers - the module tree and the object
     list of the seat's image, refreshed after every act and every drag */
  .view { width:330px; flex:none; display:flex; flex-direction:column;
          background:#12161b; border-left:1px solid #22272e; overflow-y:auto; }
  .view .digest { padding:6px 12px; color:#4ade80; font-size:11px; word-break:break-all; }
  .view .digest .was { color:#4a545f; }
  .view .checked { color:#5f6b78; font-size:11px; padding:0 12px 6px; }
  .view .pane { overflow-y:auto; }
  .view .node { padding:3px 12px; cursor:pointer; color:#9aa7b4; white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; }
  .view .node:hover { background:#1b2128; }
  .view .node.sel { background:#1b2128; color:#dfe6ee; }
  .view .node .twisty { display:inline-block; width:14px; color:#4a545f; }
  .view .node .count { color:#4a545f; font-size:11px; }
  .view .row { display:grid; grid-template-columns:1fr auto auto; gap:8px;
               padding:3px 12px; cursor:pointer; color:#9aa7b4; }
  .view .row:hover { background:#1b2128; }
  .view .row .name { overflow:hidden; text-overflow:ellipsis; }
  .view .row .value { color:#c9d3dd; cursor:ew-resize; user-select:none;
                      padding:0 4px; border:1px solid transparent; border-radius:4px; }
  .view .row .value:hover { border-color:#2b323a; }
  .view .row .value.drag { border-color:#4ade80; color:#4ade80; }
  .view .row .size { color:#4a545f; font-size:11px; }
  .view .row.pinned .name::after { content:" (pinned)"; color:#4a545f; }
</style>

<div class="side">
  <h2>commands</h2>
  <div id="cmds"></div>
  <hr>
  <h2>modifications</h2>
  <div id="mods"></div>
  <hr>
  <h2>the write slice</h2>
  <div id="channel"></div>
  <hr>
  <h2>this image</h2>
  <div class="item" id="state">-</div>
</div>

<div class="main">
  <div class="tabs" id="tabs">
    <div class="newtab" id="newtab" title="fork this image">+</div>
  </div>
  <div class="termwrap" id="termwrap"><div class="term" id="term"></div></div>
  <div class="strip">
    <button id="snap">Snapshot</button>
    <span id="where">boots</span>
    <span class="grow" id="digest-mini">digest -</span>
    <span id="bytes">-</span>
  </div>
</div>

<div class="view">
  <h2>the digest and what it covers</h2>
  <div class="digest" id="digest-line">-</div>
  <div class="digest" id="digest-was"></div>
  <div class="checked" id="digest-checked">the bytes are not read yet</div>
  <div class="checked" id="digest-diff">no byte diff yet</div>
  <hr>
  <h2>module tree</h2>
  <div class="pane" id="tree"></div>
  <hr>
  <h2>objects</h2>
  <div class="pane" id="objects"></div>
</div>

<script type="module">
  import { Rxf } from "./rxf.js";
  import * as Frames from "./frames.js";
  import * as Acts from "./acts.js";
  import * as Digest from "./digest.js";
  import * as Tree from "./tree.js";

  const tabs = document.getElementById("tabs");
  const newtab = document.getElementById("newtab");
  const term = document.getElementById("term");
  const termwrap = document.getElementById("termwrap");
  const stateEl = document.getElementById("state");
  const where = document.getElementById("where");
  const bytes = document.getElementById("bytes");
  const digestMini = document.getElementById("digest-mini");
  const digestLine = document.getElementById("digest-line");
  const digestWas = document.getElementById("digest-was");
  const digestChecked = document.getElementById("digest-checked");
  const digestDiff = document.getElementById("digest-diff");
  const treeEl = document.getElementById("tree");
  const objectsEl = document.getElementById("objects");

  /* one console per image: each tab owns its own stream and prompt */
  const windows = [];
  let current = 0;

  function line(w, text, cls) {
    const el = document.createElement("div");
    el.className = "line" + (cls ? " " + cls : "");
    el.textContent = text;
    w.stream.appendChild(el);
    term.scrollTop = term.scrollHeight;
  }

  /* the prompt lives in the stream: typing continues where the output is */
  function ask(w) {
    w.prompt?.remove();
    const el = document.createElement("div");
    el.className = "ask";
    el.innerHTML = '<span class="ps1">rxf&gt;</span>';
    const input = document.createElement("input");
    input.autocomplete = "off";
    input.spellcheck = false;
    el.appendChild(input);
    w.stream.appendChild(el);
    w.prompt = el;
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const text = input.value;
      input.remove();
      el.remove();
      w.prompt = null;
      line(w, `rxf> ${text}`, "cmd");
      Promise.resolve(run(w, text.trim())).finally(() => ask(w));
    });
    input.focus();
    term.scrollTop = term.scrollHeight;
  }

  function run(w, text) {
    if (!text) return;
    const name = text.split(/\s+/)[0];
    const cmd = COMMANDS.find((c) => c.name === name);
    if (cmd) return cmd.act(w, text);
    line(w, `no command ${name}`, "err");
  }

  /* the channel's stage actions, as one visible round: every step reports
     what the seat answered (ok or the refusal in words), never silently. */
  function reportStep(w) {
    return (s) => {
      if (s.ok) line(w, `${s.name} ok: ${s.detail}`, "ok");
      else line(w, `${s.name} refused: ${s.failure}`, "err");
    };
  }

  async function stageAction(w, which) {
    try {
      if (which === "reset") {
        const answer = Acts.exchange(w.rxf, Frames.OP.STAGE_RESET);
        if (answer.status !== 0) throw new Acts.Refusal(Frames.OP.STAGE_RESET, answer);
        line(w, "stage_reset ok: the stage is cleared", "ok");
      } else if (which === "write") {
        const staged = w.stage.bytes;
        for (let at = 0; at < staged.length; at += Acts.CHUNK) {
          const chunk = staged.subarray(at, at + Acts.CHUNK);
          const answer = Acts.exchange(w.rxf, Frames.OP.STAGE_WRITE, at, chunk);
          if (answer.status !== 0) throw new Acts.Refusal(Frames.OP.STAGE_WRITE, answer);
          line(w, `stage_write ok: ${chunk.length} bytes at ${at}`, "ok");
        }
      } else if (which === "commit") {
        const sha = await stageSha(w);
        const digest = Acts.commit(w.rxf, w.stage.bytes, sha, reportStep(w));
        line(w, `the image is at ${digest}`, "ok");
        await changed(w, digest);
        return;
      } else if (which === "compact") {
        const done = Acts.compact(w.rxf);
        line(w, `compact ok: ${done.handles} handles, ${done.body} bytes, ${done.reclaimed} reclaimed`, "ok");
        line(w, `the image is at ${done.digest}`, "ok");
        await changed(w, done.digest);
        return;
      }
      refresh(w);
    } catch (error) {
      line(w, `${error.message}`, "err");
      refresh(w);
    }
  }

  /* the staged bytes' SHA-256: recomputed here over the bytes that are
     actually staged (the empty delta's word is not the last delta's), with
     the host's word only when this page cannot hash (no secure context). */
  async function stageSha(w) {
    const subtle = globalThis.crypto && globalThis.crypto.subtle;
    if (subtle) return Acts.hex(new Uint8Array(await subtle.digest("SHA-256", w.stage.bytes)));
    if (w.stage.sha256) return w.stage.sha256;
    throw new Error("the page cannot hash the staged bytes here (no subtle crypto)");
  }

  const COMMANDS = [
    { name: "help", what: "what you can do here", act: (w) => {
        for (const c of COMMANDS) line(w, `  ${c.name.padEnd(10)} ${c.what}`, "sys");
      } },
    { name: "run", what: "one turn of the image", act: (w) => {
        const status = w.rxf.turn();
        const text = new TextDecoder().decode(w.rxf.drain());
        const lines = text.split("\n").filter((l) => l.trim());
        if (lines.length) line(w, "the boot smoke program's answer:", "sys");
        for (const l of lines) line(w, l);
        if (!lines.length) line(w, "(the image said nothing on its line)", "sys");
        line(w, `status ${status}`, status === 0 ? "ok" : "err");
        refresh(w);
      } },
    { name: "fork", what: "snapshot this image into a new tab", act: () => snapshot() },
    { name: "digest", what: "the canonical digest of this image (docs/32 5.4)", act: (w) => {
        /* The write slice's read face: DIGEST answers the digest of the
         * canonical bytes the image would dump - the word a modification's
         * answer is, so watching a change is asking this before and after. */
        w.rxf.send(Frames.encode(Frames.OP.DIGEST, 1, 0));
        w.rxf.turn();
        const { frames } = Frames.decode(w.rxf.drain());
        for (const f of frames) {
          if (f.status === 0) {
            const hex = [...f.payload].map((b) => b.toString(16).padStart(2, "0")).join("");
            line(w, hex, "ok");
          } else {
            line(w, `${f.op} status ${f.status} ${Frames.STATUS[f.status]}`, "err");
          }
        }
        if (!frames.length) line(w, "(the image answered no frame)", "sys");
      } },
    { name: "stage", what: "stage reset|write|commit: the staged bytes, one action at a time",
      act: (w, text) => stageAction(w, text.split(/\s+/)[1] || "commit") },
    { name: "compact", what: "compact the arena in place", act: (w) => stageAction(w, "compact") },
    { name: "bytes", what: "how big this image is in memory", act: (w) =>
        line(w, `${w.rxf.snapshot().length} bytes`, "ok") },
    { name: "honors", what: "the founding core", act: (w) => {
        const out = new TextEncoder().encode("honors");
        w.rxf.send(Frames.encode(Frames.OP.RESOLVE, 1, 0, out));
        w.rxf.turn();
        const { frames } = Frames.decode(w.rxf.drain());
        for (const f of frames) {
          line(w, `${f.op} status ${f.status} ${f.payload.length} bytes`, f.status ? "err" : "ok");
        }
        if (!frames.length) line(w, "(the image answered no frame)", "sys");
      } },
    ...Acts.ACTS.map((a) => ({ name: a.name, what: `${a.what}  (${a.usage})`, act: (w, text) =>
        modify(w, a, text.split(/\s+/).slice(1)) })),
  ];

  /* modifications: the acts that change the image from inside. Each stages
     its delta through the channel (web/frames.js: STAGE_RESET/WRITE/COMMIT),
     commits, and prints the digest the commit answered - the same word the
     `digest` command asks for, so a change is watched before and after. The
     delta's bytes are compiled on the host (web/acts.py behind POST /compile:
     one defining language, never a packer in the page); web/acts.js carries
     them. Typed at the prompt an act takes its arguments (`set PATH VALUE`);
     clicked in the side panel it takes defaults that make a new change each
     time. Every stage action of the round is its own visible line. */
  async function modify(w, act, args) {
    const given = args.length ? args : act.defaults(w.history);
    const request = act.make(given);
    line(w, `${act.name} ${given.join(" ")}`, "sys");
    try {
      const done = await Acts.perform(w.rxf, w.history, request, "", reportStep(w));
      line(w, `committed ${done.bytes} bytes of delta`, "sys");
      line(w, `was ${done.before}`, "sys");
      line(w, `now ${done.after}`, "ok");
      w.stage = { bytes: done.delta, sha256: done.sha256 };
      await changed(w, done.after, done.before);
    } catch (error) {
      line(w, `${error.message}`, "err");
      await refreshView(w);
    }
    refresh(w);
  }

  const MODS = [
    { name: "rename an object", what: "pick one and give it a new name", act: (w) => modify(w, Acts.ACTS[0], []) },
    { name: "change a value", what: "write into a payload and watch the digest", act: (w) => modify(w, Acts.ACTS[1], []) },
    { name: "add an entry", what: "a new object under an existing one", act: (w) => modify(w, Acts.ACTS[2], []) },
  ];

  const CHANNEL = [
    { name: "stage reset", what: "clear the stage", act: (w) => stageAction(w, "reset") },
    { name: "stage write", what: "write the staged bytes (the last delta, or the empty one)",
      act: (w) => stageAction(w, "write") },
    { name: "stage commit", what: "commit the staged bytes, digest as the answer",
      act: (w) => stageAction(w, "commit") },
    { name: "compact", what: "compact the arena in place", act: (w) => stageAction(w, "compact") },
  ];

  for (const c of COMMANDS) {
    const el = document.createElement("div");
    el.className = "item";
    el.dataset.name = c.name;
    el.innerHTML = `${c.name}<span class="sub">${c.what}</span>`;
    el.onclick = () => { const w = windows[current]; if (w) {
      w.prompt?.remove(); w.prompt = null;
      line(w, `rxf> ${c.name}`, "cmd");
      Promise.resolve(run(w, c.name)).finally(() => ask(w));
    } };
    document.getElementById("cmds").appendChild(el);
  }
  for (const m of MODS) {
    const el = document.createElement("div");
    el.className = "item";
    el.dataset.name = m.name;
    el.innerHTML = `${m.name}<span class="sub">${m.what}</span>`;
    el.onclick = () => { const w = windows[current]; if (w) {
      w.prompt?.remove(); w.prompt = null;
      line(w, `rxf> ${m.name}`, "cmd");
      Promise.resolve(m.act(w)).finally(() => ask(w));
    } };
    document.getElementById("mods").appendChild(el);
  }
  for (const c of CHANNEL) {
    const el = document.createElement("div");
    el.className = "item";
    el.dataset.name = c.name;
    el.innerHTML = `${c.name}<span class="sub">${c.what}</span>`;
    el.onclick = () => { const w = windows[current]; if (w) {
      w.prompt?.remove(); w.prompt = null;
      line(w, `rxf> ${c.name}`, "cmd");
      Promise.resolve(c.act(w)).finally(() => ask(w));
    } };
    document.getElementById("channel").appendChild(el);
  }

  function render() {
    for (const el of tabs.querySelectorAll(".tab")) el.remove();
    windows.forEach((w, i) => {
      const el = document.createElement("div");
      el.className = "tab" + (i === current ? " active" : "");
      const name = document.createElement("span");
      name.textContent = w.title;
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "x";
      el.append(name, x);
      el.onclick = (e) => {
        if (e.target === x) return close(i);
        current = i;
        showCurrent();
      };
      tabs.insertBefore(el, newtab);
    });
    showCurrent();
  }

  /* every console is its own stream: switching tabs shows only that image's */
  /* the strip follows the image: anything that changed it calls this */
  function refresh(w) {
    if (!w) return;
    bytes.textContent = `${w.rxf.snapshot().length} bytes in memory`;
    stateEl.textContent = w.parent ? `fork of ${w.parent}` : "the one that booted";
    const now = w.digest || "-";
    digestMini.textContent = `digest ${now.slice(0, 16)}…`;
  }

  /* the byte diff as one line: what the change moved in the canonical form */
  function diffText(d) {
    if (!d) return "byte diff: no pin before this one";
    if (!d.changed && !d.grown) return "byte diff: no bytes moved";
    const runs = d.runs.map((r) => `0x${r.at.toString(16)}+${r.count}`).join(", ");
    const more = d.spans > d.runs.length ? `, +${d.spans - d.runs.length} more` : "";
    const grown = d.grown ? ` · ${d.grown > 0 ? "+" : ""}${d.grown} bytes of length` : "";
    return `byte diff: ${d.changed} bytes in ${d.spans} run(s) at ${runs}${more}${grown}`;
  }

  /* the browser digest: the pin every change is shown through. The bytes the
     browser holds are hashed against the word the seat answered (web/digest.js;
     refused bytes never reach the strip), and the byte diff of the two pins
     says what this change moved. */
  function pinDigest(w, seen) {
    const d = w.bytes ? Digest.diff(w.bytes, seen.bytes) : null;
    w.bytes = seen.bytes;
    w.digest = seen.digest;
    digestLine.textContent = seen.digest;
    digestMini.textContent = `digest ${seen.digest.slice(0, 16)}…`;
    digestDiff.textContent = diffText(d);
    digestChecked.textContent =
      `${seen.length} canonical bytes · SHA-256 ${seen.verified ? "checked against the digest" : "not checked here"}`;
    return d;
  }

  /* the digest and the panes follow every act and every drag: after any of
     them the browser-side view is re-read from the seat's own bytes - the
     module tree and the object list show the new state with no reload. The
     answer is the byte diff of this change against the pin before it. */
  async function changed(w, now, was = "") {
    if (was) {
      digestWas.textContent = `was ${was}`;
      digestWas.className = "digest was";
    }
    digestLine.textContent = now;
    digestMini.textContent = `digest ${now.slice(0, 16)}…`;
    await refreshView(w);
    refresh(w);
  }

  async function refreshView(w) {
    if (!w || windows[current] !== w) return null;
    digestChecked.textContent = "reading the canonical bytes…";
    try {
      const seen = await Tree.view(w.rxf);
      const d = pinDigest(w, seen);
      w.view = seen;
      renderTree(w);
      renderObjects(w);
      refresh(w);
      return d;
    } catch (error) {
      digestChecked.textContent = `the view failed: ${error.message}`;
      refresh(w);
      return null;
    }
  }

  function renderTree(w) {
    treeEl.textContent = "";
    const seen = w.view;
    if (!seen) return;
    const expanded = w.expanded;
    const draw = (node, depth) => {
      const el = document.createElement("div");
      el.className = "node" + (node.handle === w.selected ? " sel" : "");
      el.style.paddingLeft = `${12 + depth * 12}px`;
      const twisty = document.createElement("span");
      twisty.className = "twisty";
      const kids = node.children.length;
      twisty.textContent = kids ? (expanded.has(node.handle) ? "▾" : "▸") : "·";
      el.appendChild(twisty);
      const name = document.createElement("span");
      name.textContent = node.name || "(anonymous)";
      el.appendChild(name);
      if (kids) {
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = ` ${kids}`;
        el.appendChild(count);
      }
      twisty.onclick = (e) => {
        e.stopPropagation();
        if (!kids) return;
        if (expanded.has(node.handle)) expanded.delete(node.handle);
        else expanded.add(node.handle);
        renderTree(w);
      };
      el.onclick = () => {
        w.selected = node.handle;
        renderTree(w);
        renderObjects(w);
      };
      treeEl.appendChild(el);
      if (expanded.has(node.handle)) {
        for (const child of Tree.children(seen.arena, node.handle)) draw(child, depth + 1);
      }
    };
    draw(Tree.root(seen.arena), 0);
  }

  function renderObjects(w) {
    objectsEl.textContent = "";
    const seen = w.view;
    if (!seen) return;
    const at = w.selected ?? seen.arena.root;
    for (const node of Tree.children(seen.arena, at)) {
      const el = document.createElement("div");
      el.className = "row" + (node.path ? "" : " pinned");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = node.name || "(anonymous)";
      const value = document.createElement("span");
      value.className = "value";
      value.textContent = node.value === null ? `-${node.size}B` : String(node.value);
      value.onclick = (e) => e.stopPropagation(); // dragging the value is not a click on the row
      const size = document.createElement("span");
      size.className = "size";
      size.textContent = `${node.size}B`;
      el.append(name, value, size);
      if (node.children.length) {
        el.onclick = () => {
          w.selected = node.handle;
          w.expanded.add(node.handle);
          renderTree(w);
          renderObjects(w);
        };
      }
      if (node.value !== null && node.path && Number(node.value) <= Number.MAX_SAFE_INTEGER) dragValue(w, node, value);
      objectsEl.appendChild(el);
    }
    if (!objectsEl.children.length) {
      const el = document.createElement("div");
      el.className = "item";
      el.textContent = "(no objects under this node)";
      objectsEl.appendChild(el);
    }
  }

  /* the browser's own modification (U2): drag a value and the bytes and the
     digest change while the hand moves. Each settled value is one `set` act
     through the host's compiler - the same chain a typed act takes - and after
     every one of them the browser digest is pinned again: the bytes the browser
     holds are hashed against the word the seat answers, and the byte diff of
     the two pins is shown beside it. The panes re-read the seat's bytes when
     the drag ends - after the queued acts, never while one is still in flight.
     A drag writes one JSON number (web/acts.js's `set`), so a value past the
     safe integer range cannot round-trip that face and is shown, not dragged. */
  function dragValue(w, node, el) {
    const max = Math.min(2 ** (8 * node.size) - 1, Number.MAX_SAFE_INTEGER);
    el.dataset.drag = node.path; // the row a hand can drag (the drag prove grabs it)
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add("drag");
      const start = { x: e.clientX, value: Number(node.value), at: 0, valueNow: Number(node.value), last: Number(node.value) };
      const settle = (force) => {
        const now = Date.now();
        if (!force && now - start.at < 250) return;
        if (start.valueNow === start.last) return;
        start.at = now;
        start.last = start.valueNow;
        const value = start.valueNow;
        const request = { act: "set", path: node.path, value };
        w.queue = w.queue.then(async () => {
          const answer = await Acts.perform(w.rxf, w.history, request, "", () => {});
          el.textContent = String(value);
          digestWas.textContent = `was ${answer.before}`;
          digestWas.className = "digest was";
          digestChecked.textContent = "reading the canonical bytes…";
          const seen = await Digest.view(w.rxf);
          const d = pinDigest(w, seen);
          line(w, `drag set ${node.name} ${value} · ${answer.bytes} bytes · ${diffText(d)} · now ${seen.digest}`, "ok");
          if (seen.digest !== answer.after) {
            line(w, `drag set ${node.name}: the commit answered ${answer.after} but the seat is at ${seen.digest}`, "err");
          }
        }).catch((error) => line(w, `drag set ${node.name}: ${error.message}`, "err"));
      };
      const move = (ev) => {
        const steps = Math.round((ev.clientX - start.x) / 4);
        start.valueNow = Math.min(max, Math.max(0, start.value + steps));
        el.textContent = String(start.valueNow);
        settle(false);
      };
      const up = () => {
        el.classList.remove("drag");
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        settle(true);
        /* the panes follow the drag after the last queued act has committed:
           reading them here would pin the end of the drag to its middle. The
           line at the end of the chain says the drag is whole. */
        w.queue = w.queue
          .then(() => refreshView(w))
          .then(() => line(w, "drag end: the panes re-read the seat's bytes", "sys"));
      };
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });
  }

  function showCurrent() {
    for (const w of windows) w.stream.style.display = "none";
    const w = windows[current];
    if (!w) return;
    w.stream.style.display = "block";
    term.scrollTop = term.scrollHeight;
    stateEl.textContent = w.parent ? `fork of ${w.parent}` : "the one that booted";
    where.textContent = w.parent ? `forked from ${w.parent}` : "boots";
    bytes.textContent = `${w.rxf.snapshot().length} bytes in memory`;
    if (w.view) {
      digestLine.textContent = w.digest || w.view.digest;
      renderTree(w);
      renderObjects(w);
    }
    Promise.resolve(refreshView(w));
  }

  function close(i) {
    windows[i].stream.remove();
    windows.splice(i, 1);
    if (!windows.length) return location.reload();
    current = Math.min(current, windows.length - 1);
    render();
  }

  async function open(saved, parent, history = []) {
    const rxf = saved
      ? await Rxf.forkFrom("rxf_boot.wasm", "rxf_leaves.wasm", saved)
      : await Rxf.open("rxf_boot.wasm", "image_wasm32.bin", "rxf_leaves.wasm");
    const stream = windows.length
      ? document.createElement("div")
      : term;
    stream.className = "term";
    if (stream !== term) termwrap.appendChild(stream);
    const w = {
      rxf, stream, parent, history: [...history], title: parent ? `fork ${windows.length}` : "image",
      prompt: null,
      view: null,
      bytes: null, // the pinned canonical bytes (the browser digest's own)
      digest: null,
      selected: null,
      expanded: new Set(),
      stage: { bytes: Acts.emptyDelta(), sha256: null },
      queue: Promise.resolve(),
    };
    windows.push(w);
    current = windows.length - 1;
    line(w, parent ? `forked from ${parent}` : "the image is up", parent ? "ok" : "sys");
    line(w, `${rxf.snapshot().length} bytes carried`, "sys");
    line(w, "");
    ask(w);
    render();
    await refreshView(w);
    return w;
  }

  async function snapshot() {
    const w = windows[current];
    if (!w) return;
    await open(w.rxf.snapshot(), w.title, w.history);
  }

  document.getElementById("snap").onclick = snapshot;
  newtab.onclick = snapshot;

  await open(null, null);
</script>
